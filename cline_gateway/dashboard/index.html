<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cline Gateway</title>
<style>
:root{
  --bg:#0f1115; --panel:#151820; --card:#1a1e27; --elev:#222736;
  --field:#10131a; --stripe:#161a22; --border:#262c3a;
  --accent:#8b7cf7; --accent-deep:#7466e0; --accent-soft:#b3a7fb; --accent-dim:#2c2b45;
  --fg:#e8eaf0; --muted:#9aa1b2; --faint:#666e80;
  --ok:#3ddc84; --warn:#ffc857; --err:#ff6b7a;
  --r:10px;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:14px/1.5 "Segoe UI", system-ui, sans-serif;
  display:flex; overflow:hidden;
}
.mono{font-family:"Cascadia Mono","Consolas",monospace; font-size:12px}
a{color:var(--accent-soft); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- layout ---------- */
#side{width:212px; flex:none; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 12px;}
#main{flex:1; display:flex; flex-direction:column; min-width:0}
#view{flex:1; overflow-y:auto; padding:22px 26px 40px}

/* ---------- brand ---------- */
#brand{display:flex; align-items:center; gap:10px; padding:2px 6px 18px; border-bottom:1px solid var(--border); margin-bottom:14px}
#brand .mark{width:5px; height:34px; background:var(--accent); border-radius:2px; flex:none}
#brand b{font:600 16px "Segoe UI Semibold", "Segoe UI", sans-serif; display:block}
#brand small{color:var(--faint); font-size:11px}
#brand small:hover{text-decoration:underline; color:var(--accent-soft)}

/* ---------- nav ---------- */
.nav-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:none; border:0; color:var(--muted); padding:10px 12px; border-radius:8px;
  font:14px "Segoe UI", sans-serif; cursor:pointer; margin-bottom:2px}
.nav-btn:hover{background:var(--elev); color:var(--fg)}
.nav-btn.on{background:var(--accent-dim); color:var(--fg)}
.nav-btn .ico{width:17px; text-align:center; font-size:15px; flex:none; opacity:.9}
.nav-btn.on .ico{color:var(--accent-soft)}
#side .spacer{flex:1}
#side .foot{padding:10px 12px 2px; border-top:1px solid var(--border); color:var(--faint); font-size:11px}

/* ---------- top bar ---------- */
#top{display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--border); background:var(--panel)}
#top h1{font:600 15px "Segoe UI Semibold","Segoe UI",sans-serif; margin-right:auto}
.chip{display:inline-flex; align-items:center; gap:7px; background:var(--card);
  border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:12px; color:var(--muted)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none}
.dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(61,220,132,.15)}
.dot.warn{background:var(--warn); box-shadow:0 0 0 3px rgba(255,200,87,.14)}
.dot.err{background:var(--err); box-shadow:0 0 0 3px rgba(255,107,122,.14)}
.dot.off{background:var(--faint)}

/* ---------- buttons ---------- */
.btn{border:0; border-radius:8px; cursor:pointer; font:600 13px "Segoe UI",sans-serif;
  padding:9px 16px; transition:background .12s, border-color .12s, color .12s}
.btn-pri{background:var(--accent); color:#0e0b22}
.btn-pri:hover{background:var(--accent-deep)}
.btn-pri:disabled{background:var(--elev); color:var(--faint); cursor:default}
.btn-ghost{background:var(--card); color:var(--fg); border:1px solid var(--border)}
.btn-ghost:hover{background:var(--elev); border-color:var(--accent-dim)}
.btn-quiet{background:transparent; color:var(--muted)}
.btn-quiet:hover{background:var(--elev); color:var(--fg)}
.btn-sm{padding:6px 11px; font-size:12px}
.btn-danger:hover{border-color:var(--err); color:var(--err)}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r);
  padding:16px 18px; margin-bottom:16px}
.card h2{font:600 13px "Segoe UI Semibold",sans-serif; margin-bottom:10px}
.card h3{font:600 11px "Segoe UI Semibold",sans-serif; color:var(--faint);
  text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:13px 15px}
.kpi .v{font:600 22px "Segoe UI Semibold",sans-serif}
.kpi .k{color:var(--muted); font-size:12px; margin-top:2px}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:13px}
th{color:var(--faint); font:600 10px "Segoe UI Semibold",sans-serif; text-transform:uppercase;
  letter-spacing:.06em; text-align:left; padding:8px 10px; border-bottom:1px solid var(--border);
  cursor:default; position:sticky; top:0; background:var(--card); z-index:1}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--fg)}
td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--elev)}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:nth-child(even):hover{background:var(--elev)}
tbody tr.sel{background:var(--accent-dim) !important}
.tbl-wrap{border:1px solid var(--border); border-radius:var(--r); overflow:auto; background:var(--card)}

/* ---------- states ---------- */
.badge{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600}
.b-ready,.b-available{background:rgba(61,220,132,.13); color:var(--ok)}
.b-cooling,.b-partial{background:rgba(255,200,87,.13); color:var(--warn)}
.b-dead,.b-exhausted,.b-blocked,.b-capped,.b-no_entitlement{background:rgba(255,107,122,.13); color:var(--err)}
.b-paid_exhausted,.b-unavailable{background:rgba(179,167,251,.13); color:var(--accent-soft)}
.b-usage,.b-free,.b-plan{background:rgba(154,161,178,.12); color:var(--muted)}

/* ---------- forms ---------- */
input[type=text],input[type=number],select{
  background:var(--field); color:var(--fg); border:1px solid var(--border);
  border-radius:8px; padding:8px 11px; font:13px "Segoe UI",sans-serif; outline:none; width:100%}
input:focus,select:focus{border-color:var(--accent)}
.field{margin-bottom:13px}
.field label{display:block; color:var(--muted); font-size:12px; margin-bottom:5px}
.field .help{color:var(--faint); font-size:11px; margin-top:4px}
fieldset{border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; background:var(--card)}
legend{padding:0 8px; color:var(--faint); font:600 11px "Segoe UI Semibold",sans-serif;
  text-transform:uppercase; letter-spacing:.07em}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 18px; font-size:13px}
.kv dt{color:var(--muted)} .kv dd{color:var(--fg)}
.copyable{cursor:pointer} .copyable:hover{color:var(--accent-soft)}

/* ---------- misc ---------- */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.toolbar .grow{flex:1}
.empty{padding:44px 20px; text-align:center; color:var(--muted)}
.empty h3{font:600 16px "Segoe UI Semibold",sans-serif; color:var(--fg);
  text-transform:none; letter-spacing:0; margin-bottom:8px}
.steps{display:flex; gap:26px; margin:14px 0 20px; flex-wrap:wrap}
.steps div{display:flex; gap:9px; align-items:baseline}
.steps b{color:var(--accent); font-size:19px}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--card); border:1px solid var(--border); border-radius:999px;
  padding:9px 18px; font-size:13px; display:none; z-index:50; max-width:80%;
  box-shadow:0 8px 30px rgba(0,0,0,.45)}
#toast.ok{border-color:var(--ok); color:var(--ok)}
#toast.err{border-color:var(--err); color:var(--err)}
#toast.warn{border-color:var(--warn); color:var(--warn)}
#login{max-width:360px; margin:12vh auto; text-align:center}
#login .card{text-align:left}
.mono-list{font-family:"Cascadia Mono",monospace; font-size:12px; white-space:pre-wrap; word-break:break-all}
canvas.chart{width:100%; height:190px}
.scroll{max-height:340px; overflow-y:auto}
details{margin-bottom:8px}
summary{cursor:pointer; color:var(--muted); font-size:13px; padding:6px 0}
summary:hover{color:var(--fg)}
.model-acc{padding:8px 12px; border-left:2px solid var(--border); margin:2px 0 10px 8px; font-size:12px; color:var(--muted)}

/* ---------- compact models table ---------- */
.tbl-compact td{padding:5px 10px; font-size:12.5px}
.tbl-compact details{margin:0}
.tbl-compact summary{padding:0; list-style:none; display:flex; align-items:center; gap:8px}
.tbl-compact summary::-webkit-details-marker{display:none}
.tbl-compact summary .caret{color:var(--faint); font-size:10px; transition:transform .12s; flex:none}
.tbl-compact details[open] summary .caret{transform:rotate(90deg)}
.tbl-compact .model-acc{margin:6px 0 4px 4px; padding:4px 10px}
th .arr{font-size:9px; margin-left:3px; color:var(--accent-soft)}

/* ---------- dense settings ---------- */
.dense-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.dense fieldset{margin-bottom:0}
.dense .field{display:grid; grid-template-columns:150px 1fr; gap:2px 12px;
  align-items:center; margin-bottom:7px}
.dense .field label{margin-bottom:0; font-size:12px}
.dense .field .help{grid-column:2; margin-top:1px}
.dense input[type=text],.dense input[type=number],.dense select{padding:6px 9px; font-size:12.5px}

/* ---------- guide ---------- */
.guide h2{margin-top:0}
.guide ol{margin:8px 0 10px 20px; color:var(--muted)}
.guide ol li{margin-bottom:6px}
.guide .note{color:var(--faint); font-size:12px; margin-top:8px}
.guide kbd{background:var(--elev); border:1px solid var(--border); border-radius:5px;
  padding:1px 7px; font:12px "Cascadia Mono",monospace}

/* ---------- confirm modal ---------- */
#confirm-modal{position:fixed; inset:0; background:rgba(5,7,10,.62); display:none;
  align-items:center; justify-content:center; z-index:70}
#confirm-modal .confirm-card{background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:18px 20px; width:380px; max-width:90vw;
  box-shadow:0 16px 50px rgba(0,0,0,.55)}
#confirm-modal b{font:600 14px "Segoe UI Semibold",sans-serif}
#confirm-modal p{color:var(--muted); font-size:13px; margin-top:8px; white-space:pre-wrap}
.confirm-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
.btn-danger-solid{background:var(--err); color:#26090e}
.btn-danger-solid:hover{background:#ff8595}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--elev); border-radius:6px; border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border)}
</style>
</head>
<body>

<!-- login (only when admin key is needed and not yet entered) -->
<div id="login" style="display:none">
  <div class="card">
    <h2>Cline Gateway</h2>
    <p style="color:var(--muted); font-size:13px; margin-bottom:14px">
      Enter the admin key to manage this gateway.</p>
    <div class="field">
      <label>Admin key</label>
      <input type="text" id="login-key" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn btn-pri" style="width:100%" onclick="App.login()">Continue</button>
  </div>
</div>

<aside id="side" style="display:none">
  <div id="brand">
    <span class="mark"></span>
    <div><b>Cline Gateway</b>
      <a href="https://t.me/B3hnamR" target="_blank" rel="noopener"><small>@B3hnamR · t.me/B3hnamR</small></a>
    </div>
  </div>
  <button class="nav-btn" data-tab="accounts" onclick="App.tab('accounts')"><span class="ico">◉</span>Accounts</button>
  <button class="nav-btn" data-tab="models" onclick="App.tab('models')"><span class="ico">◇</span>Models</button>
  <button class="nav-btn" data-tab="server" onclick="App.tab('server')"><span class="ico">▣</span>Server</button>
  <button class="nav-btn" data-tab="settings" onclick="App.tab('settings')"><span class="ico">⚙</span>Settings</button>
  <button class="nav-btn" data-tab="stats" onclick="App.tab('stats')"><span class="ico">∑</span>Stats</button>
  <button class="nav-btn" data-tab="logs" onclick="App.tab('logs')"><span class="ico">≡</span>Logs</button>
  <button class="nav-btn" data-tab="guide" onclick="App.tab('guide')"><span class="ico">?</span>Guide</button>
  <div class="spacer"></div>
  <div class="foot" id="foot-ver"></div>
</aside>

<div id="main" style="display:none">
  <div id="top">
    <h1 id="tab-title">Accounts</h1>
    <span class="chip"><span class="dot off" id="dot-server"></span><span id="chip-server">gateway</span></span>
    <span class="chip"><span class="dot off" id="dot-cline"></span><span id="chip-cline">Cline: …</span></span>
    <span class="chip" id="chip-ready"></span>
    <button class="btn btn-quiet btn-sm" id="btn-update" title="updates"
      style="display:none; position:relative" onclick="App.showUpdate()">🔔
      <span id="update-dot" style="position:absolute; top:2px; right:2px; width:8px; height:8px;
        border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent)"></span>
    </button>
    <button class="btn btn-quiet btn-sm" id="btn-toggle" onclick="App.toggleServer()">…</button>
  </div>
  <div id="view"></div>
</div>

<div id="toast"></div>

<!-- in-app confirm dialog -->
<div id="confirm-modal">
  <div class="confirm-card">
    <b id="cf-title"></b>
    <p id="cf-body"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost btn-sm" id="cf-cancel">Cancel</button>
      <button class="btn btn-pri btn-sm" id="cf-ok">OK</button>
    </div>
  </div>
</div>

<!-- update available card -->
<div id="update-card" style="display:none; position:fixed; top:64px; right:22px; z-index:60;
  width:360px; background:var(--card); border:1px solid var(--accent-dim); border-radius:12px;
  padding:16px 18px; box-shadow:0 12px 40px rgba(0,0,0,.5)">
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px">
    <b style="font-size:14px">Update available</b>
    <span class="mono" id="upd-versions" style="color:var(--accent-soft)"></span>
    <div class="grow" style="flex:1"></div>
    <button class="btn btn-quiet btn-sm" onclick="App.hideUpdate()">✕</button>
  </div>
  <div id="upd-notes" class="mono-list" style="max-height:160px; overflow-y:auto;
    color:var(--muted); margin-bottom:12px"></div>
  <div style="display:flex; gap:8px; flex-wrap:wrap">
    <button class="btn btn-pri btn-sm" id="upd-go" onclick="App.doUpdate()">Update now</button>
    <a class="btn btn-ghost btn-sm" id="upd-link" href="#" target="_blank" rel="noopener"
      style="text-decoration:none; display:inline-flex; align-items:center">Release notes</a>
    <button class="btn btn-quiet btn-sm" onclick="App.skipUpdate()">Skip this version</button>
  </div>
  <div id="upd-progress" style="color:var(--faint); font-size:12px; margin-top:8px"></div>
</div>

<script>
"use strict";
const App = (() => {
  /* ------------ state ------------ */
  let key = sessionStorage.getItem("gw-admin-key") || "";
  let curTab = "accounts";
  let timer = null;
  let serverUp = true;
  const cache = {};

  /* ------------ http ------------ */
  async function api(path, opts = {}) {
    opts.headers = Object.assign({"Authorization": "Bearer " + key,
      "Content-Type": "application/json"}, opts.headers || {});
    if (opts.body && typeof opts.body !== "string")
      opts.body = JSON.stringify(opts.body);
    let r;
    try { r = await fetch(path, opts); }
    catch (e) { serverUp = false; paintChips(); throw new Error("gateway unreachable"); }
    serverUp = true;
    if (r.status === 401 || r.status === 403) { showLogin(); throw new Error("bad admin key"); }
    if (!r.ok) {
      let detail = r.statusText;
      try { detail = (await r.json()).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    return r.json();
  }

  /* ------------ ui helpers ------------ */
  function toast(msg, kind = "") {
    const t = document.getElementById("toast");
    t.textContent = msg; t.className = kind; t.style.display = "block";
    clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 4500);
  }
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s ?? "").replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmtUsd = micro => (micro === null || micro === undefined) ? "—"
    : "$" + (micro / 1e6).toFixed(2);
  const fmtSecs = s => { if (s === null || s === undefined) return "—";
    if (s < 60) return s + "s"; const h = Math.floor(s/3600), m = Math.round(s%3600/60);
    return h ? `${h}h ${m}m` : `${m}m`; };
  const fmtLeft = ms => { const d = ms - Date.now(); if (d <= 0) return "expired";
    const m = Math.floor(d/60000), h = Math.floor(m/60);
    return h ? `${h}h ${m%60}m` : `${m} min`; };
  function badge(state){ return `<span class="badge b-${esc(state)}">${esc(state)}</span>`; }
  function copy(text){ navigator.clipboard.writeText(text).then(
    () => toast("copied", "ok"), () => toast("copy failed", "err")); }

  /* ------------ login ------------ */
  function showLogin(){
    $("#login").style.display = "block";
    $("#side").style.display = "none";
    $("#main").style.display = "none";
  }
  function hideLogin(){
    $("#login").style.display = "none";
    $("#side").style.display = "flex";
    $("#main").style.display = "flex";
  }
  async function login(){
    key = $("#login-key").value.trim();
    try { await api("/admin/dash/server"); }
    catch (e) { toast(e.message, "err"); return; }
    sessionStorage.setItem("gw-admin-key", key);
    hideLogin(); boot();
  }

  /* ------------ confirm dialog (replaces native confirm()) ------------ */
  function confirmDlg(title, body, okLabel = "OK", danger = false){
    return new Promise(resolve => {
      const m = $("#confirm-modal");
      $("#cf-title").textContent = title;
      $("#cf-body").textContent = body;
      const ok = $("#cf-ok");
      ok.textContent = okLabel;
      ok.className = "btn btn-sm " + (danger ? "btn-danger-solid" : "btn-pri");
      m.style.display = "flex";
      const done = v => {
        m.style.display = "none";
        ok.onclick = null; $("#cf-cancel").onclick = null;
        m.onclick = null; document.onkeydown = null;
        resolve(v);
      };
      ok.onclick = () => done(true);
      $("#cf-cancel").onclick = () => done(false);
      m.onclick = e => { if (e.target === m) done(false); };
      document.onkeydown = e => {
        if (e.key === "Escape") done(false);
        if (e.key === "Enter") done(true);
      };
    });
  }

  /* ------------ updates ------------ */
  let updStatus = null;
  async function pollUpdate(){
    try {
      updStatus = await api("/admin/dash/update/status");
    } catch (e) { return; }
    const skipped = localStorage.getItem("gw-skip-version") || "";
    const show = updStatus && updStatus.update_available
      && updStatus.latest !== skipped;
    $("#btn-update").style.display = show ? "" : "none";
  }
  function showUpdate(){
    if (!updStatus || !updStatus.update_available) return;
    $("#upd-versions").textContent =
      `${updStatus.current || "?"} → ${updStatus.latest || "?"}`;
    $("#upd-notes").textContent = updStatus.notes || "";
    $("#upd-link").href = updStatus.release_url || "#";
    $("#upd-progress").textContent = "";
    $("#upd-go").disabled = false;
    $("#update-card").style.display = "block";
  }
  function hideUpdate(){ $("#update-card").style.display = "none"; }
  function skipUpdate(){
    if (updStatus && updStatus.latest)
      localStorage.setItem("gw-skip-version", updStatus.latest);
    hideUpdate(); pollUpdate();
  }
  async function doUpdate(){
    const btn = $("#upd-go");
    btn.disabled = true;
    try {
      $("#upd-progress").textContent = "downloading…";
      await api("/admin/dash/update/download", {method:"POST"});
      $("#upd-progress").textContent = "downloaded — restarting to apply…";
      await api("/admin/dash/update/apply", {method:"POST"});
      $("#upd-progress").textContent =
        "updating — the tool relaunches itself in a few seconds.";
    } catch (e) {
      $("#upd-progress").textContent = "update failed: " + e.message;
      btn.disabled = false;
    }
  }

  /* ------------ chips / top bar ------------ */
  async function paintChips(){
    $("#dot-server").className = "dot " + (serverUp ? "ok" : "err");
    $("#chip-server").textContent = serverUp ? "gateway: up" : "gateway: unreachable";
    $("#btn-toggle").textContent = serverUp ? "Stop" : "…";
    if (!serverUp) return;
    try {
      const cs = await api("/admin/dash/cline-status");
      const kinds = {running:"ok", logged_in:"ok", installed:"warn", off:"off"};
      $("#dot-cline").className = "dot " + (kinds[cs.chip_kind] || "off");
      $("#chip-cline").textContent = cs.detail;
    } catch (e) { /* chip stays */ }
    try {
      const pool = await api("/admin/pool/state");
      const total = Object.values(pool.by_state || {}).reduce((a, b) => a + b, 0);
      $("#chip-ready").textContent = `${pool.ready}/${total} accounts ready`;
    } catch (e) { $("#chip-ready").textContent = ""; }
    pollUpdate();
  }

  async function toggleServer(){
    if (!serverUp) { toast("gateway is not running", "warn"); return; }
    if (!(await confirmDlg("Stop the gateway?",
        "The process exits and frees the port.\nRelaunch ClineGateway.exe to start it again.",
        "Stop", true))) return;
    try { await api("/admin/dash/shutdown", {method: "POST"}); } catch (_) {}
    serverUp = false; paintChips();
    $("#btn-toggle").textContent = "Stopped";
    toast("gateway stopped — you can close this window", "ok");
  }

      !q || m.model.toLowerCase().includes(q));
    const keyFns = {
      rank:  m => [STATUS_RANK[m.overall] ?? 9, m.model],
      model: m => m.model,
      lane:  m => [m.lane, m.model],
      ratio: m => [(m.total_accounts ? m.available_on/m.total_accounts : 0), m.model],

    };
    const fn = keyFns[sort.key] || keyFns.rank;
    models.sort((a, b) => {
      const ka = fn(a), kb = fn(b);
      const cmp = JSON.stringify(ka) < JSON.stringify(kb) ? -1
                : JSON.stringify(ka) > JSON.stringify(kb) ? 1 : 0;
      return cmp * sort.dir;
    });
    const th = (label, key) => {

      const arr = on ? (sort.dir === 1 ? "▲" : "▼") : "";

  function barChart(canvas, rows, valKey, labelKey){
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    const c = canvas.getContext("2d"); c.scale(dpr, dpr);
    const max = Math.max(1, ...rows.map(r => r[valKey]||0));
    const bw = rows.length ? Math.max(8, (w-60)/rows.length - 8) : 8;
    c.strokeStyle = "#262c3a"; c.lineWidth = 1;
    for (let i=1;i<4;i++){ const y = h-24 - (h-40)*i/4;
      c.beginPath(); c.moveTo(46,y); c.lineTo(w-8,y); c.stroke(); }
    rows.forEach((r,i)=>{
      const x = 50 + i*((w-60)/Math.max(rows.length,1));
      const bh = (h-44) * ((r[valKey]||0)/max);
      c.fillStyle = "#8b7cf7";
      c.fillRect(x, h-24-bh, bw, bh);
      c.fillStyle = "#666e80"; c.font = "10px Segoe UI"; c.textAlign = "center";
      const lbl = String(r[labelKey]||"—").split("/").pop().slice(0,10);
      c.fillText(lbl, x+bw/2, h-10);
    });
  }

  function tab(name){
    curTab = name;

  function refresh(){
    const v = $("#view");
    if (curTab === "accounts") { const q = $("#acct-q"); if (q) cache.acctQ = q.value; }
    if (curTab === "models")   { const q = $("#mdl-q");  if (q) cache.mdlQ  = q.value; }

      `<div class="card"><div class="empty"><h3>Could not load</h3><p>${esc(e.message)}</p></div></div>`; });
    paintChips();
  }
  function restartTimer(){
    clearInterval(timer);
    // live tabs poll; static tabs don't
    const live = {accounts:4000, models:6000, logs:3000, stats:8000}[curTab];
    if (live) timer = setInterval(() => refresh(), live);
  }
